name: Live canary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  tests-live:
    name: Tests (100% coverage, live ENS site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      # Real Google Chrome for the network tests, which use headed
      # channel="chrome" to get past the ENS site's WAF (it blocks headless).
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
      # Ubuntu images restrict unprivileged Chromium user namespaces.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pip install -r pylock.toml
      - run: pip install -e . --no-deps
      - run: patchright install-deps chromium
      - run: patchright install chromium
      # The full suite enforces --cov-fail-under=100, including live checks.
      - run: xvfb-run pytest
