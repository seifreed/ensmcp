[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ensmcp"
version = "0.1.1"
description = "Servidor MCP con las medidas de seguridad del ENS (Anexo II del RD 311/2022): matriz de aplicabilidad y checklist de auditoría, sin conexión"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marc Rivero Lopez | @seifreed", email = "mriverolopez@gmail.com" }]
requires-python = ">=3.12"
# The lower bound is the oldest interpreter exercised by the CI matrix and the
# universal lock. `tests/test_packaging.py` keeps the manifest and lock aligned.
dependencies = [
    "mcp>=2.0.0",
]

[project.scripts]
ensmcp = "ensmcp.__main__:main"

[project.optional-dependencies]
live = [
    "patchright>=1.61.2",
]
dev = [
    # `tests/test_packaging.py` compara los rangos de pyproject con lo que fija
    # el lock, y para eso necesita leer versiones y requisitos. Está declarado
    # aunque hoy entre igualmente como dependencia transitiva de pip: apoyarse en
    # eso es la misma clase de fallo que ese test existe para impedir.
    "packaging>=26.3",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "black>=24.10",
    "ruff>=0.7",
    "mypy>=1.13",
    "bandit>=1.8",
    "pip-audit>=2.10.1",
    "patchright>=1.61.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ensmcp"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "N", "ANN", "S", "RUF"]

[tool.mypy]
strict = true
warn_unused_ignores = true
exclude = ["^venv/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Los generadores de datos de scripts/ no son parte del paquete instalable (no
# se distribuyen: sólo regeneran los ficheros que sí se distribuyen), pero su
# parsing heurístico sobre texto de PDF es lo bastante delicado como para
# necesitar tests. Esto los hace importables sin convertirlos en un paquete.
pythonpath = ["scripts"]
addopts = "--cov=src/ensmcp --cov-report=term-missing --cov-branch --cov-fail-under=100"
markers = [
    "network: requires external network access to a real public site (ENS Navegable, python.org, w3schools) — needs Chrome headed + display, cannot run offline",
]

[tool.coverage.run]
branch = true
source = ["src/ensmcp"]
parallel = true
relative_files = true

[tool.bandit]
exclude_dirs = ["./venv"]
