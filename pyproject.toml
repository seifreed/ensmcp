[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ensmcp"
version = "0.1.0"
description = "MCP server exposing CCN-CERT ENS Navegable security measures via live browser scraping"
readme = "README.md"
requires-python = ">=3.14"
# El mínimo declarado es el que se bloquea en pylock.toml, que es el único que
# se instala y se prueba. Decir menos era falso: `mcp>=1.9.0` lo cumplen las 21
# versiones de la serie 1.x y en ninguna existe `mcp.server.mcpserver`, el
# módulo que importa `mcp_server/server.py` — se comprobó una a una. Un
# resolutor que eligiera cualquiera de ellas instalaba `ensmcp` sin una queja y
# el servidor moría al arrancar con `ModuleNotFoundError`. CI instala desde el
# lock, así que el rango declarado no se ejercitaba nunca en su extremo bajo.
# `tests/test_packaging.py` mantiene los dos ficheros de acuerdo.
dependencies = [
    "mcp>=2.0.0",
    "patchright>=1.61.2",
]

[project.scripts]
ensmcp = "ensmcp.__main__:main"

[project.optional-dependencies]
dev = [
    # `tests/test_packaging.py` compara los rangos de pyproject con lo que fija
    # el lock, y para eso necesita leer versiones y requisitos. Está declarado
    # aunque hoy entre igualmente como dependencia transitiva de pip: apoyarse en
    # eso es la misma clase de fallo que ese test existe para impedir.
    "packaging>=26.3",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "black>=24.10",
    "ruff>=0.7",
    "mypy>=1.13",
    "bandit>=1.8",
    "pip-audit>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ensmcp"]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "N", "ANN", "S", "RUF"]

[tool.mypy]
strict = true
warn_unused_ignores = true
exclude = ["^venv/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Los generadores de datos de scripts/ no son parte del paquete instalable (no
# se distribuyen: sólo regeneran los ficheros que sí se distribuyen), pero su
# parsing heurístico sobre texto de PDF es lo bastante delicado como para
# necesitar tests. Esto los hace importables sin convertirlos en un paquete.
pythonpath = ["scripts"]
addopts = "--cov=src/ensmcp --cov-report=term-missing --cov-branch --cov-fail-under=100"
markers = [
    "network: requires external network access to a real public site (ENS Navegable, python.org, w3schools) — needs Chrome headed + display, cannot run offline",
]

[tool.coverage.run]
branch = true
source = ["src/ensmcp"]
parallel = true
relative_files = true

[tool.bandit]
exclude_dirs = ["./venv"]
